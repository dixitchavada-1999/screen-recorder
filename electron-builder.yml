appId: com.screenrecorder.desktop
productName: Screen Recorder
copyright: Copyright © 2026 Screen Recorder

directories:
  output: release/${version}
  buildResources: build

# Only the compiled output ships. Source, configs and sourcemaps are excluded.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/*/{test,__tests__,tests,example,examples,doc,docs}/**'
  - '!**/node_modules/*/*.md'
  # `get-windows` brings a toolchain for compiling its binary from source —
  # node-gyp, node-pre-gyp and everything they pull in. The prebuilt binary is
  # loaded directly (see app-tracker.ts), so none of it ever runs; it is left
  # out of the installer rather than shipped as dead weight.
  - '!node_modules/get-windows/node_modules/**'
  - '!node_modules/get-windows/{Sources/**,binding.gyp}'
  - '!node_modules/get-windows/lib/binding/napi-6-*/**'
  - '!node_modules/@isaacs/cliui/**'
  - '!node_modules/@mapbox/node-pre-gyp/**'
  - '!node_modules/@npmcli/agent/**'
  - '!node_modules/@npmcli/fs/**'
  - '!node_modules/@pkgjs/parseargs/**'
  - '!node_modules/aggregate-error/**'
  - '!node_modules/aproba/**'
  - '!node_modules/are-we-there-yet/**'
  - '!node_modules/cacache/**'
  - '!node_modules/clean-stack/**'
  - '!node_modules/color-support/**'
  - '!node_modules/console-control-strings/**'
  - '!node_modules/delegates/**'
  - '!node_modules/eastasianwidth/**'
  - '!node_modules/encoding/**'
  - '!node_modules/foreground-child/**'
  - '!node_modules/fs-minipass/**'
  - '!node_modules/gauge/**'
  - '!node_modules/has-unicode/**'
  - '!node_modules/imurmurhash/**'
  - '!node_modules/indent-string/**'
  - '!node_modules/is-lambda/**'
  - '!node_modules/jackspeak/**'
  - '!node_modules/make-dir/**'
  - '!node_modules/make-fetch-happen/**'
  - '!node_modules/minipass-collect/**'
  - '!node_modules/minipass-fetch/**'
  - '!node_modules/minipass-flush/**'
  - '!node_modules/minipass-pipeline/**'
  - '!node_modules/minipass-sized/**'
  - '!node_modules/node-addon-api/**'
  - '!node_modules/node-fetch/**'
  - '!node_modules/npmlog/**'
  - '!node_modules/p-map/**'
  - '!node_modules/package-json-from-dist/**'
  - '!node_modules/path-scurry/**'
  - '!node_modules/set-blocking/**'
  - '!node_modules/smart-buffer/**'
  - '!node_modules/socks/**'
  - '!node_modules/socks-proxy-agent/**'
  - '!node_modules/ssri/**'
  - '!node_modules/string-width-cjs/**'
  - '!node_modules/strip-ansi-cjs/**'
  - '!node_modules/tr46/**'
  - '!node_modules/unique-filename/**'
  - '!node_modules/unique-slug/**'
  - '!node_modules/webidl-conversions/**'
  - '!node_modules/whatwg-url/**'
  - '!node_modules/wide-align/**'
  - '!node_modules/wrap-ansi-cjs/**'

asar: true

# The scheme email confirmation links come back on. Registering it here is what
# lets the OS hand `screenrecorder://auth/callback#…` to the installed app;
# `app.setAsDefaultProtocolClient` alone only covers the running process.
protocols:
  - name: Screen Recorder
    schemes:
      - screenrecorder

# FFmpeg is a native executable and cannot be spawned from inside an asar
# archive, so it is unpacked next to it. `ffmpeg-locator.ts` rewrites the path.
asarUnpack:
  - node_modules/ffmpeg-static/**
  # `uiohook-napi` ships a `.node` binary, and the dynamic loader cannot open one
  # from inside an asar archive any more than it can spawn an executable there.
  - node_modules/uiohook-napi/**
  # The window-reading binary (Windows) and helper executable (macOS) for
  # application tracking; same reason as above.
  - node_modules/get-windows/**

# An `ffmpeg/` folder placed beside the executable overrides the bundled binary.
extraResources:
  - from: ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
  # whisper.cpp, fetched by `scripts/fetch-whisper.mjs` before a packaged build.
  # Unlike ffmpeg there is no npm package behind it, so an empty folder here
  # means an app that cannot transcribe — the README says as much.
  - from: whisper
    to: whisper
    filter:
      - '**/*'
      - '!README.md'
  # The tray loads these at runtime, so they must ship inside resources/ rather
  # than staying build-time-only assets. `trayTemplate*` is the macOS menu-bar
  # glyph; nativeImage resolves the @2x file itself, so both have to be there.
  - from: build/icon.png
    to: build/icon.png
  - from: build/trayTemplate.png
    to: build/trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: build/trayTemplate@2x.png

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
win:
  # The `.ico` rather than the PNG, so electron-builder skips its WebAssembly
  # converter — a step that needs a large allocation up front and fails the
  # whole build on a machine that is short of memory. `npm run icon` writes it.
  icon: build/icon.ico
  # Installer only. A portable build cannot update itself — the updater refuses
  # to overwrite a file somebody placed by hand — and building both made
  # electron-builder open two GitHub releases at once, splitting the assets
  # between them.
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Screen Recorder
  deleteAppDataOnUninstall: false
  # Refuse to install over a running instance rather than corrupting it.
  runAfterFinish: true

# ---------------------------------------------------------------------------
# macOS
#
# Must be built ON macOS: the .app bundle, the .icns icon and the .dmg image
# are all produced by macOS-only tooling (codesign, hdiutil). Windows and Linux
# hosts cannot cross-build this section.
# ---------------------------------------------------------------------------
mac:
  icon: build/icon.png
  category: public.app-category.video
  # Both silicon generations. Intel Macs get x64, Apple Silicon gets arm64.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

  # Required from macOS 10.15 onwards for anything Apple will notarise.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

  # Ad-hoc signing: produces an installable build with no Apple Developer
  # account. The first launch needs right-click -> Open, or:
  #   xattr -cr "/Applications/Screen Recorder.app"
  # Replace with your "Developer ID Application: …" identity to ship signed.
  identity: null

  # Permission prompts. macOS kills the app instead of asking when the matching
  # key is missing, so every capture path the recorder uses is declared here.
  extendInfo:
    NSMicrophoneUsageDescription: >
      Screen Recorder needs the microphone to record your voice alongside the
      screen.
    NSCameraUsageDescription: >
      Screen Recorder needs the camera only if you add a camera overlay to a
      recording.
    NSAppleEventsUsageDescription: >
      Screen Recorder uses system events to control recording from the menu bar.
    # Screen capture itself is granted through System Settings ->
    # Privacy & Security -> Screen Recording, not through a usage string.
    LSMinimumSystemVersion: '11.0'

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # The familiar drag-to-Applications window.
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

# ---------------------------------------------------------------------------
# Linux (Ubuntu)
# ---------------------------------------------------------------------------
linux:
  icon: build/icon.png
  category: AudioVideo
  synopsis: Lightweight screen recorder with system and microphone audio
  description: >
    Records the full screen or a single window to MP4, capturing system audio
    and the microphone together. Built with Electron and FFmpeg.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: Screen Recorder
      Comment: Record your screen with system and microphone audio
      Categories: AudioVideo;Recorder;
      StartupWMClass: Screen Recorder
      # Tells the desktop environment this app owns screenrecorder:// links.
      # Without it the browser has nothing to hand an email confirmation to.
      MimeType: x-scheme-handler/screenrecorder;

deb:
  # Runtime libraries Electron and screen capture need on a clean Ubuntu.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
  # Recommended rather than required: the app ships its own FFmpeg binary, and
  # PipeWire/portal packages are only needed on Wayland sessions.
  recommends:
    - ffmpeg
    - xdg-desktop-portal
    - xdg-desktop-portal-gtk

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# ---------------------------------------------------------------------------
# Updates
#
# The application asks this repository's releases whether a newer version has
# been published, and the dashboard offers it. `latest.yml` is written beside
# the installer by electron-builder and is the file the check actually reads -
# an installer uploaded without it is invisible to every running copy.
#
# The repository has to be public. A private one would mean shipping a GitHub
# token inside the application, which is the same as publishing it.
#
# `npm run release` builds and uploads in one step. It needs GH_TOKEN in the
# environment - a token with `public_repo`, kept on the release machine and
# never in the app.
# ---------------------------------------------------------------------------

publish:
  provider: github
  owner: dixitchavada-1999
  repo: screen-recorder
  # Left as a draft, and published by `scripts/publish-release.mjs` immediately
  # afterwards. Asking GitHub for a published release outright fails with
  # "Published releases must have a valid tag" — the tag does not exist yet, and
  # it is publishing the draft that creates it.
  releaseType: draft
